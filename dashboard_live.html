<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>台股訊號儀表板</title>
<style>
  :root{
    --bg:#f5f6f8;
    --panel:#ffffff;
    --line:#e3e6ea;
    --ink:#1c2430;
    --sub:#6b7684;
    --up:#d1443a;
    --down:#1f9254;
    --accent:#2456c4;
    --accent-soft:#eaf0ff;
    --amber:#b9820a;
    --amber-soft:#fff6df;
    --red-strong:#c62828;
    --red-soft:#fdeaea;
    --green-soft:#e9f7ef;
    --purple:#7b4fd6;
    --purple-soft:#f2ecfd;
    --mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    --sans: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", -apple-system, BlinkMacSystemFont, sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:var(--sans);
    background:var(--bg);
    color:var(--ink);
    font-size:13px;
    -webkit-font-smoothing:antialiased;
  }
  .topbar{
    background:var(--panel);
    border-bottom:1px solid var(--line);
    padding:10px 16px;
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:18px;
  }
  .ctrl{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--sub);}
  .ctrl select, .ctrl input[type=number]{
    border:1px solid var(--line);
    border-radius:6px;
    padding:4px 8px;
    font-size:12.5px;
    color:var(--ink);
    background:#fff;
  }
  .banks{display:flex;flex-wrap:wrap;gap:10px;align-items:center;}
  .banks label{display:flex;align-items:center;gap:4px;font-size:12.5px;color:var(--ink);white-space:nowrap;}
  .refresh-btn{
    margin-left:auto;
    background:var(--accent);
    color:#fff;
    border:none;
    border-radius:6px;
    padding:7px 16px;
    font-size:12.5px;
    font-weight:600;
    cursor:pointer;
  }
  .refresh-btn:hover{background:#1d45a5;}

  .status-line{
    padding:7px 16px;
    background:var(--green-soft);
    color:#1f6b3e;
    font-size:12.5px;
    border-bottom:1px solid var(--line);
    display:flex;
